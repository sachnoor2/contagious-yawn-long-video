name: Generate Bark Audio and Render Contagious Yawn Long Video
on: workflow_dispatch
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install Bark dependencies
        run: pip install torch transformers scipy numpy
      - name: Generate approved Bark voice locally
        run: |
          mkdir -p public/audio
          python generate_bark.py
          ffprobe -v error -show_streams public/audio/voiceover.wav
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install
      - name: Render five independently rendered chunks
        run: |
          mkdir -p out/chunks
          for i in 0 1 2 3 4; do start=$((i*1080)); end=$(((i+1)*1080-1)); npx remotion render src/index.ts ContagiousYawn out/chunks/chunk-$i.mp4 --frames=$start-$end; done
      - name: Stitch and run end-to-end QA
        run: |
          python stitch_chunks.py
          python final_recheck.py
      - uses: actions/upload-artifact@v4
        with: {name: contagious-yawn-long-video-final, path: out/contagious-yawn-final.mp4}
